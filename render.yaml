# Render Blueprint: InsightAI API + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: insightai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insightai-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: insightai-db
    plan: free
    databaseName: insight_ai
    user: insight_ai
