version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: insight_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insight_ai
      POSTGRES_USER: insight_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  pg_data: